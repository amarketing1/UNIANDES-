name: Temporary UNIANDES manual PDF render

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/render-manual-pdf.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Render the HTML manual as PDF
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "${BROWSER}"
          "${BROWSER}" \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=5000 \
            --no-pdf-header-footer \
            --print-to-pdf="${GITHUB_WORKSPACE}/Manual_de_Marca_UNIANDES_2026.pdf" \
            "file://${GITHUB_WORKSPACE}/manual/Manual_de_Marca_UNIANDES_JUAN%20RODRIGUEZ.html"
          test -s "${GITHUB_WORKSPACE}/Manual_de_Marca_UNIANDES_2026.pdf"
          file "${GITHUB_WORKSPACE}/Manual_de_Marca_UNIANDES_2026.pdf"
          ls -lh "${GITHUB_WORKSPACE}/Manual_de_Marca_UNIANDES_2026.pdf"

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: Manual_de_Marca_UNIANDES_2026
          path: Manual_de_Marca_UNIANDES_2026.pdf
          if-no-files-found: error
          retention-days: 1

      - name: Store PDF on the temporary branch
        shell: bash
        run: |
          set -euo pipefail
          cp Manual_de_Marca_UNIANDES_2026.pdf /tmp/Manual_de_Marca_UNIANDES_2026.pdf
          git fetch origin chatgpt-pdf-manual-20260902
          git checkout -B chatgpt-pdf-manual-20260902 origin/chatgpt-pdf-manual-20260902
          cp /tmp/Manual_de_Marca_UNIANDES_2026.pdf Manual_de_Marca_UNIANDES_2026.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Manual_de_Marca_UNIANDES_2026.pdf
          git commit -m "Generate UNIANDES 2026 brand manual PDF"
          git push origin "HEAD:chatgpt-pdf-manual-20260902"
